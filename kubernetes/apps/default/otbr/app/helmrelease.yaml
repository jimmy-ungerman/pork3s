---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otbr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: otbr
  values:
    controllers:
      otbr:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"iot",
                "namespace": "kube-system",
                "ips": ["10.5.0.30/24", "fd22:ae86:237c:1::30/64"],
                "mac": "4a:e3:b1:72:c5:9d"
              }]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
            sysctls:
              - name: net.ipv6.conf.all.forwarding
                value: "1"
              - name: net.ipv6.conf.net1.forwarding
                value: "1"
              - name: net.ipv6.conf.net1.accept_ra
                value: "2"
              - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
                value: "64"
        containers:
          app:
            image:
              repository: ghcr.io/wittdennis/homeassistant-otbr
              tag: 4.2.1@sha256:81f366342b6f1e85d5cbb0f0d6abde7e77375a0cccf8de0f215d734b3a709cd4
            env:
              BACKBONE_IF: net1
              BAUDRATE: "460800"
              FIREWALL: "1"
              NAT64: "1"
              NETWORK_DEVICE: "10.5.0.64:6638"
            securityContext:
              privileged: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /node
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /node
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /node
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: otbr
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          # / returns 404; probe the OTBR REST health endpoint (same as the container probes).
          gatus.home-operations.com/endpoint: |
            url: https://otbr.porkboi.io/node
        hostnames:
          - "{{ .Release.Name }}.porkboi.io"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: otbr
                port: *port

    persistence:
      data:
        existingClaim: otbr
