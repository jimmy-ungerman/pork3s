---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: staub-scraper
spec:
  chartRef:
    kind: OCIRepository
    name: staub-scraper
  interval: 1h
  values:
    controllers:
      staub-scraper:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jimmy-ungerman/staubscraper
              tag: 2.1.3@sha256:1a9fb4c382c62098ac7524c37a4233090f17ca80705a42cbe99219f403c1db21
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: "10m"
                memory: "50Mi"
              limits:
                cpu: "200m"
                memory: "512Mi"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 5123
                  initialDelaySeconds: 25
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
    service:
      app:
        ports:
          http:
            port: 5123
    persistence:
      tmp:
        type: emptyDir
