---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-mcp-secret
    template:
      data:
        HOMEASSISTANT_TOKEN: "{{ .HASS_MCP_TOKEN }}"
        # Standard-mode ha-mcp authenticates by URL-path secrecy, so the path
        # lives only in 1Password; refuse anything short or not a path
        MCP_SECRET_PATH: >-
          {{ if or (not (hasPrefix "/" .MCP_SECRET_PATH)) (lt (len .MCP_SECRET_PATH) 24) }}{{ fail "home-assistant-mcp MCP_SECRET_PATH must be a high-entropy path like /private_<token>, at least 24 chars" }}{{ end }}{{ .MCP_SECRET_PATH }}
  dataFrom:
    - extract:
        key: home-assistant-mcp
