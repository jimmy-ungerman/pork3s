---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: big10survivor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: big10survivor
  values:
    controllers:
      big10survivor:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jimmy-ungerman/big10survivor
              tag: 1.8.2@sha256:69da0c96c452c4677c45fc23518e575f7f6f6e293d238c4da28a59734f36c76c
            env:
              ENTRY_FEE: "25"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
    service:
      app:
        ports:
          http:
            port: 3002
    route:
      app:
        hostnames:
          - "survivor.porkboi.io"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
