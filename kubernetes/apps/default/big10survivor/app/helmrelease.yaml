---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: big10survivor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: big10survivor
  values:
    controllers:
      big10survivor:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jimmy-ungerman/big10survivor
              tag: 1.12.0@sha256:7bc503884bffb2a599c35dc15b14014d02d419c4b18b73fbc85da86930f3aea3
            env:
              ENTRY_FEE: "25"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
    service:
      app:
        ports:
          http:
            port: 3002
    route:
      app:
        hostnames:
          - "survivor.porkboi.io"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
