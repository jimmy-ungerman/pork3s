---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: big10survivor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: big10survivor
  values:
    controllers:
      big10survivor:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jimmy-ungerman/big10survivor
              tag: 1.14.1@sha256:8d09865fe334fadcb439d1211e60c1bfce27ab0aaece54bb626d8cc0eb8b64e1
            env:
              ENTRY_FEE: "25"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
    service:
      app:
        ports:
          http:
            port: 3002
    route:
      app:
        hostnames:
          - "survivor.porkboi.io"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
