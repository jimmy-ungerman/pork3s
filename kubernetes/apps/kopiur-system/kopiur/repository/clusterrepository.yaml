---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: ba-sing-se
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: nas.porkboi.io:30188
      region: ba-sing-se
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Kopia's own defaults are 5000 MiB per budget, larger than the whole cache
      # PVC, so the sweeper never runs and the cache fills the volume. The
      # metadata budget applies twice (kopia caps the index-blobs cache at the
      # same size). The smallest cache PVCs are 1Gi (big10survivor, sabnzbd), so
      # content + 2 x metadata = 768 MiB must stay under that.
      contentCacheSizeMb: 256
      metadataCacheSizeMb: 256
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: America/New_York
