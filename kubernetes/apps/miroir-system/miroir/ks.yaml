---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miroir
spec:
  dependsOn:
    - name: snapshot-controller
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/miroir-system/miroir/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: miroir-system.miroir
    namespace: flux-system
  targetNamespace: miroir-system
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miroir-config
spec:
  dependsOn:
    - name: miroir
  # StorageClass parameters are immutable; force recreates the class on change
  # (existing PVs keep their own replica layout)
  force: true
  interval: 1h
  path: ./kubernetes/apps/miroir-system/miroir/config
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: miroir-system.miroir
    namespace: flux-system
  targetNamespace: miroir-system
  wait: true
