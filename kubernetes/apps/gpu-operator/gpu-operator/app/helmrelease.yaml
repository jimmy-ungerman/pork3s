---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.2
      sourceRef:
        kind: HelmRepository
        name: nvidia
  interval: 1h
  values:
    # Talos provides the driver and container toolkit as system extensions
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    # The Spark is tainted ai=true:NoSchedule; operands must tolerate it
    daemonsets:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: ai
          operator: Equal
          value: "true"
          effect: NoSchedule
    node-feature-discovery:
      worker:
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Equal
            value: ""
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: ai
            operator: Equal
            value: "true"
            effect: NoSchedule
