---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kritika
spec:
  cluster:
    name: kritika-postgres
  name: kritika
  owner: kritika
  extensions:
    - name: vector
    # No 1.3.0 -> 1.1.1 downgrade exists: reverting this pin does not undo the applied
    # ALTER EXTENSION. Take a verified pg_dump of kritika before publishing a new pin.
    - name: vchord
      # renovate: datasource=docker depName=ghcr.io/home-operations/vchord
      version: "1.3.0"
