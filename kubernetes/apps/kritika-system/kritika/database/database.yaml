---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kritika
spec:
  cluster:
    name: kritika-postgres
  name: kritika
  owner: kritika
  extensions:
    - name: vector
    # There is no 1.3.0 -> 1.1.1 downgrade: reverting this manifest does not undo the applied
    # ALTER EXTENSION. Take and verify a pg_dump of kritika BEFORE publishing this pin, and on a
    # failed post-upgrade validation restore it onto the 1.1.1 image with the 1.1.1 pin. Procedure:
    # https://github.com/jimmy-ungerman/pork3s/blob/main/docs/runbooks/kritika-vchord-upgrade.md#rollback
    - name: vchord
      # renovate: datasource=docker depName=ghcr.io/home-operations/vchord
      version: "1.3.0"
