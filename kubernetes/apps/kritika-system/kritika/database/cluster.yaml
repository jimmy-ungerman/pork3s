---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm
  enablePDB: false
  enableSuperuserAccess: false
  # CNPG rejects changes to imageName and postgresql.parameters in the same update.
  # Apply them separately and let the first rollout finish before applying the second.
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/home-operations/vchord:1.5.0@sha256:97b4a1aa15b65c29fa97e84b4270cb235e7bd39e80d4a4b2e91d9fa17997566d
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - vchord
  storage:
    size: 10Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 2Gi
  bootstrap:
    initdb:
      database: kritika
      secret:
        name: kritika-postgres-credentials
