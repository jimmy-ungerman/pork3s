---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: artifactgenerator
spec:
  # The ArtifactGenerator CRD is installed by source-watcher, which flux-instance deploys
  dependsOn:
    - name: flux-instance
  interval: 1h
  path: ./kubernetes/apps/flux-system/artifactgenerator/app
  prune: true
  # Stays on the GitRepository: this is the Kustomization that produces the ExternalArtifacts
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: true
