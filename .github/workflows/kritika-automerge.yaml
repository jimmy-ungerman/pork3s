---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Kritika Automerge

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
  pull_request_review:
    types:
      - submitted
  # Kritika / Review is a commit status, not a check run, so check_run never fires for it
  status:
  # Build Success is an Actions job, which check_run never fires for
  workflow_run: # zizmor: ignore[dangerous-triggers] only main's script runs, and it re-reads live PR state
    workflows:
      - CI
    types:
      - completed

permissions: {}

jobs:
  # Runs when CI or Kritika's status succeeds, Kritika reviews, or a label is removed.
  # The merge decision is made in .github/scripts/kritika-automerge.sh against the
  # PR's current head, labels, reviews and checks, never against this event's payload.
  merge:
    name: Merge
    if: >-
      ${{
        (
          github.event_name == 'pull_request_review' &&
          github.event.review.user.login == 'porkboiai[bot]' &&
          github.event.pull_request.user.login == 'porky-bot[bot]'
        ) ||
        (
          github.event_name == 'status' &&
          github.event.context == 'Kritika / Review' &&
          github.event.state == 'success' &&
          github.event.sender.login == 'porkboiai[bot]'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].number
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'unlabeled' &&
          github.event.pull_request.user.login == 'porky-bot[bot]'
        )
      }}
    # On the job, not the workflow: Flux posts ~50 commit statuses per merge to main, and a
    # workflow-level group would let those skipped runs cancel each other out of the queue
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    steps:
      # The default branch supplies the script, so a PR branch can never change what runs with the token
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: op://kube-secrets/github-bot/GITHUB_BOT_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: op://kube-secrets/github-bot/GITHUB_BOT_APP_PRIVATE_KEY

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # A status event carries a commit SHA, not a PR number
      - name: Find PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          number=$EVENT_PR_NUMBER
          if [[ -z $number ]]; then
            number=$(gh api "repos/${GH_REPO}/commits/${SHA}/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          fi
          if [[ -z $number ]]; then
            echo "No open PR for ${SHA}"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # Squash-merges without --auto when Kritika approved the current head at 5/5
      # with low risk and every required check has succeeded. --match-head-commit
      # makes GitHub refuse the merge if the branch moved since the decision.
      - name: Merge
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: .github/scripts/kritika-automerge.sh "$PR_NUMBER"

  # Not tied to a Kritika approval: it must also fire for a PR whose approval is long past.
  # This workflow never leaves auto-merge enabled, so this only withdraws one set elsewhere,
  # such as by hand or by Renovate, when the PR is held, becomes a major update or is pushed to.
  cancel:
    name: Cancel Auto-merge
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'porky-bot[bot]' &&
        (
          github.event.action == 'synchronize' ||
          (github.event.action == 'labeled' && (github.event.label.name == 'hold' || github.event.label.name == 'type/major'))
        )
      }}
    runs-on: ubuntu-26.04
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: op://kube-secrets/github-bot/GITHUB_BOT_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: op://kube-secrets/github-bot/GITHUB_BOT_APP_PRIVATE_KEY

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Disable Auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Fails when auto-merge was never enabled; nothing to cancel then
        run: gh pr merge "$PR_NUMBER" --disable-auto || echo "Auto-merge was not enabled"
